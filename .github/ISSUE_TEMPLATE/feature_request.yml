name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in, not just the feature you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Students and enrolments
        - Courses and intakes
        - Trainers, assessment and attendance
        - Agents and CRM
        - Fees and payments
        - Reporting and AVETMISS/NAT compliance
        - API and mobile
        - Administration and settings
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
