version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions mostly need Laravel 9+ (see "Project status" in the README).
    # Revisit this once the framework upgrade lands.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # One pull request for all updates instead of one per package.
    groups:
      composer:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions mostly need Laravel 9+ (see "Project status" in the README).
    # Revisit this once the framework upgrade lands.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
